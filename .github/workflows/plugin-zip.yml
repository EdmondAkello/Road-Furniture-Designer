name: plugin zip

# Builds the ZIP that QGIS installs (Plugins > Manage and Install Plugins > Install from ZIP).
# The repository's own "Download ZIP" is NOT installable: the plugin sits two folders down and
# its core (rfd/) and export libraries (ext_libs/) are copied in at build time.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the plugin ZIP
    runs-on: ubuntu-24.04
    outputs:
      zip: ${{ steps.build.outputs.zip }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: build
        name: Build
        run: |
          v=$(python tools/check_plugin_zip.py --version)
          z="road_furniture_designer-${v}.zip"
          python tools/build_plugin.py "$z"
          python tools/check_plugin_zip.py "$z"
          echo "zip=$z" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: road_furniture_designer-plugin
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error

  install-in-qgis:
    name: Install the ZIP in QGIS and load it
    needs: build
    runs-on: ubuntu-24.04
    container: qgis/qgis:3.44.15-trixie
    env:
      QT_QPA_PLATFORM: offscreen
      QGIS_PREFIX_PATH: /usr
      PYTHONPATH: /usr/share/qgis/python
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: road_furniture_designer-plugin
      - name: Unpack into a clean plugins folder and import the plugin
        run: |
          mkdir -p /tmp/plugins
          python3 -c "import zipfile,sys; zipfile.ZipFile('${{ needs.build.outputs.zip }}').extractall('/tmp/plugins')"
          cd /tmp
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "/tmp/plugins")
          from qgis.core import QgsApplication
          app = QgsApplication([], True); app.initQgis()
          from unittest import mock
          from qgis.gui import QgsMapCanvas
          from qgis.PyQt.QtWidgets import QMainWindow
          import road_furniture_designer as p
          win = QMainWindow()
          iface = mock.MagicMock(); iface.mapCanvas.return_value = QgsMapCanvas(); iface.mainWindow.return_value = win
          plugin = p.classFactory(iface)
          plugin.initGui()
          from road_furniture_designer.rfd.catalogue import Catalogue
          print("plugin loaded;", len(Catalogue.load().signs), "signs")
          plugin.unload()
          EOF

  release:
    name: Attach the ZIP to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, install-in-qgis]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: road_furniture_designer-plugin
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" "${{ needs.build.outputs.zip }}" --repo "$GITHUB_REPOSITORY" --clobber
